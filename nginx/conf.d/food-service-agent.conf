# Reverse proxy para food-service-agent.
# Reemplazá `tu-dominio.com` por tu dominio real antes de emitir el certificado.

upstream food_service_agent {
    server app:5001;
}

# HTTP: sirve el challenge de Certbot y redirige todo lo demás a HTTPS.
server {
    listen 80;
    server_name tu-dominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name tu-dominio.com;

    ssl_certificate     /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 2m;

    location / {
        proxy_pass http://food_service_agent;
        proxy_http_version 1.1;

        # Soporte WebSocket (Socket.IO panel admin).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
