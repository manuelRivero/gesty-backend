# Despliegue en VPS (DonWeb) detrás de Nginx Proxy Manager.
# En el servidor solo hace falta este archivo + `.env` (sin código fuente).
#
# Uso:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  app:
    image: ${DOCKER_IMAGE:-manuelrivero/food-service-agent:latest}
    container_name: food-service-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    expose:
      - "5001"
    networks:
      - proxy-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||5001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy-network:
    external: true
